<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <defs>
    <style>
      .cell { fill:#f6f6f6; stroke:#333; stroke-width:1; }
      .cell-text { font-family:Arial, Helvetica, sans-serif; font-size:14px; fill:#111; dominant-baseline:middle; text-anchor:middle; }
      .kernel-box { fill:#fff8e1; stroke:#c67f00; stroke-width:2; }
      .highlight { fill:none; stroke:#e53935; stroke-width:3; }
      .result-cell { fill:#f0f8ff; stroke:#2b6ea3; stroke-width:1.5; }
      .result-text { font-family:Arial, Helvetica, sans-serif; font-size:18px; fill:#0b57a4; text-anchor:middle; dominant-baseline:middle; }
      .breakdown { font-family:Arial, Helvetica, sans-serif; font-size:13px; fill:#333; }
    </style>
  </defs>

  <!-- Title -->
  <text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222">
    Stride 2 convolution — one output at a time, then show all results
  </text>

  <!-- Input 4x4 -->
  <rect class="cell" x="50" y="50" width="40" height="40"/><text class="cell-text" x="70" y="70">1</text>
  <rect class="cell" x="90" y="50" width="40" height="40"/><text class="cell-text" x="110" y="70">2</text>
  <rect class="cell" x="130" y="50" width="40" height="40"/><text class="cell-text" x="150" y="70">3</text>
  <rect class="cell" x="170" y="50" width="40" height="40"/><text class="cell-text" x="190" y="70">4</text>

  <rect class="cell" x="50" y="90" width="40" height="40"/><text class="cell-text" x="70" y="110">5</text>
  <rect class="cell" x="90" y="90" width="40" height="40"/><text class="cell-text" x="110" y="110">6</text>
  <rect class="cell" x="130" y="90" width="40" height="40"/><text class="cell-text" x="150" y="110">7</text>
  <rect class="cell" x="170" y="90" width="40" height="40"/><text class="cell-text" x="190" y="110">8</text>

  <rect class="cell" x="50" y="130" width="40" height="40"/><text class="cell-text" x="70" y="150">9</text>
  <rect class="cell" x="90" y="130" width="40" height="40"/><text class="cell-text" x="110" y="150">10</text>
  <rect class="cell" x="130" y="130" width="40" height="40"/><text class="cell-text" x="150" y="150">11</text>
  <rect class="cell" x="170" y="130" width="40" height="40"/><text class="cell-text" x="190" y="150">12</text>

  <rect class="cell" x="50" y="170" width="40" height="40"/><text class="cell-text" x="70" y="190">13</text>
  <rect class="cell" x="90" y="170" width="40" height="40"/><text class="cell-text" x="110" y="190">14</text>
  <rect class="cell" x="130" y="170" width="40" height="40"/><text class="cell-text" x="150" y="190">15</text>
  <rect class="cell" x="170" y="170" width="40" height="40"/><text class="cell-text" x="190" y="190">16</text>

  <!-- Kernel -->
  <g transform="translate(260,50)">
    <rect class="kernel-box" x="0" y="0" width="80" height="80" rx="4" ry="4"/>
    <text x="40" y="-6" font-family="Arial" font-size="13" text-anchor="middle" fill="#c67f00">Kernel 2×2</text>
    <rect x="8" y="8" width="32" height="32" fill="#fff" stroke="#c67f00"/><text class="cell-text" x="24" y="24">1</text>
    <rect x="40" y="8" width="32" height="32" fill="#fff" stroke="#c67f00"/><text class="cell-text" x="56" y="24">2</text>
    <rect x="8" y="40" width="32" height="32" fill="#fff" stroke="#c67f00"/><text class="cell-text" x="24" y="56">3</text>
    <rect x="40" y="40" width="32" height="32" fill="#fff" stroke="#c67f00"/><text class="cell-text" x="56" y="56">4</text>
  </g>

  <!-- Highlight rectangle (stride 2 positions) -->
  <!-- positions: (50,50), (130,50), (50,130), (130,130) -->
  <rect class="highlight" x="50" y="50" width="80" height="80" rx="2" ry="2">
    <animate attributeName="x"
             dur="4s"
             begin="0s"
             repeatCount="1"
             calcMode="discrete"
             values="50;130;50;130"/>
    <animate attributeName="y"
             dur="4s"
             begin="0s"
             repeatCount="1"
             calcMode="discrete"
             values="50;50;130;130"/>
    <!-- hide highlight at the end so final view shows all outputs without highlight -->
    <animate attributeName="opacity"
             dur="0.001s"
             begin="4s"
             fill="freeze"
             values="1;0"/>
  </rect>

  <!-- Output 2x2 grid: one value visible at a time, then all visible at the end -->
  <g transform="translate(420,70)">
    <rect class="result-cell" x="0" y="0" width="80" height="80"/>
    <text class="result-text" x="40" y="44" opacity="0">44
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="1;0;0;0;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>

    <rect class="result-cell" x="100" y="0" width="80" height="80"/>
    <text class="result-text" x="140" y="44" opacity="0">64
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="0;1;0;0;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>

    <rect class="result-cell" x="0" y="100" width="80" height="80"/>
    <text class="result-text" x="40" y="144" opacity="0">124
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="0;0;1;0;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>

    <rect class="result-cell" x="100" y="100" width="80" height="80"/>
    <text class="result-text" x="140" y="144" opacity="0">144
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="0;0;0;1;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>
  </g>

  <!-- Breakdown lines: only the active breakdown visible, then all visible at the end -->
  <g transform="translate(20,240)">
    <text class="breakdown" x="0" y="0" opacity="0">1) {1,2,5,6} · {1,2,3,4} = 44
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="1;0;0;0;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>

    <text class="breakdown" x="0" y="20" opacity="0">2) {3,4,7,8} · {1,2,3,4} = 64
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="0;1;0;0;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>

    <text class="breakdown" x="0" y="40" opacity="0">3) {9,10,13,14} · {1,2,3,4} = 124
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="0;0;1;0;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>

    <text class="breakdown" x="0" y="60" opacity="0">4) {11,12,15,16} · {1,2,3,4} = 144
      <animate attributeName="opacity"
               dur="4s"
               begin="0s"
               repeatCount="1"
               calcMode="discrete"
               values="0;0;0;1;1"
               keyTimes="0;0.25;0.5;0.75;1"
               fill="freeze"/>
    </text>
  </g>
</svg>